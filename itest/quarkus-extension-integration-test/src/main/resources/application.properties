quarkus.datasource.db-kind=postgresql
# Only the integration-test launcher uses this port; normal application HTTP stays unchanged.
quarkus.http.test-port=0
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
# Intentionally exclude the registry entity: the optional extension must contribute it.
quarkus.hibernate-orm.packages=dev.bpmcrafters.processengine.worker.acceptance
dev.bpm-crafters.process-api.worker.deployment.enabled=true
dev.bpm-crafters.process-api.worker.deployment.bpmn-resource-pattern=classpath*:/bpmn/example-process.bpmn
# This slot checks byte packaging only, not DMN engine validity.
dev.bpm-crafters.process-api.worker.deployment.dmn-resource-pattern=classpath*:/deployment/decision-fixture.txt
# Select this runtime profile for a separate retained-cache acceptance launch.
%retained.dev.bpm-crafters.process-api.worker.remove-task-result-on-completion=false
